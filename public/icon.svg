<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pickleball paddle">
  <rect width="64" height="64" rx="12" fill="#0b2ca8"/>
  <!-- paddle face -->
  <ellipse cx="32" cy="24" rx="16" ry="18" fill="#ccff00" stroke="#0d0f0a" stroke-width="3"/>
  <!-- perforated holes -->
  <circle cx="26" cy="18" r="2.2" fill="#0d0f0a"/>
  <circle cx="32" cy="16" r="2.2" fill="#0d0f0a"/>
  <circle cx="38" cy="18" r="2.2" fill="#0d0f0a"/>
  <circle cx="24" cy="24" r="2.2" fill="#0d0f0a"/>
  <circle cx="32" cy="24" r="2.2" fill="#0d0f0a"/>
  <circle cx="40" cy="24" r="2.2" fill="#0d0f0a"/>
  <circle cx="26" cy="30" r="2.2" fill="#0d0f0a"/>
  <circle cx="32" cy="32" r="2.2" fill="#0d0f0a"/>
  <circle cx="38" cy="30" r="2.2" fill="#0d0f0a"/>
  <!-- throat accent -->
  <rect x="26" y="38" width="12" height="5" rx="1.5" fill="#17e9ff" stroke="#0d0f0a" stroke-width="2"/>
  <!-- grip -->
  <rect x="27.5" y="42" width="9" height="14" rx="3" fill="#ff2e88" stroke="#0d0f0a" stroke-width="2.5"/>
  <line x1="29" y1="46" x2="35" y2="46" stroke="#0d0f0a" stroke-width="1.5"/>
  <line x1="29" y1="50" x2="35" y2="50" stroke="#0d0f0a" stroke-width="1.5"/>
</svg>
